services:
  spring:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: loop-spring-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOOP_DB_DEV_URL: ${LOOP_DB_DEV_URL}
      LOOP_DB_DEV_USERNAME: ${LOOP_DB_DEV_USERNAME}
      LOOP_DB_DEV_PASSWORD: ${LOOP_DB_DEV_PASSWORD}

  redis:
    container_name: loop-redis-dev

  nginx:
    container_name: loop-nginx-dev
    environment:
      DOMAIN_NAME: dev-api.loop.io.kr
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - /etc/letsencrypt:/etc/letsencrypt:ro