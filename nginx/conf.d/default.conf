#80번 포트: 인증서 발급용 challenge 경로(/.well-known/acme-challenge/)는 통과시키고, 나머지는 전부 443으로 리다이렉트
#443번 포트: 실제 SSL 인증서 적용해서 Spring으로 프록시

server {
    listen 80;
    server_name loop-server.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name loop-server.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/loop-server.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loop-server.p-e.kr/privkey.pem;

    location / {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}