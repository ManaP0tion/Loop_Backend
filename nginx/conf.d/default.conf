#80번 포트: 인증서 발급용 challenge 경로(/.well-known/acme-challenge/)는 통과시키고, 나머지는 전부 443으로 리다이렉트
#443번 포트: 실제 SSL 인증서 적용해서 Spring으로 프록시

server {
    listen 80;
    server_name loop-server.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name loop-server.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/loop-server.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loop-server.p-e.kr/privkey.pem;

    # nginx 기본값(1MB)이 앱의 업로드 제한(5MB)보다 작아서 큰 사진(특히 heic)이 앱까지 못 가고 여기서 413으로 막힘.
    # 앱 제한보다 여유 있게 잡아서, 실제 초과 시 nginx가 아니라 앱이 제대로 된 에러로 응답하게 함.
    client_max_body_size 10M;

    location / {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}