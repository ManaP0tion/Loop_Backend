# .github/workflows/deploy.yml
#
# 목적: upstream(ManaP0tion/Loop_Backend)의 dev 브랜치에 push(=PR 머지)되면
#       EC2 서버에 SSH로 접속해 최신 코드를 받아 자동으로 재배포한다.
#
# 전제 조건:
# - EC2 서버에 이 레포가 이미 clone되어 있어야 함 (~/Loop_Backend)
# - EC2의 git remote에 upstream(ManaP0tion/Loop_Backend)이 등록되어 있어야 함
#   (origin은 현재 chu-dw의 fork를 가리키고 있어서, pull은 upstream 기준으로 받음)
# - GitHub Secrets에 EC2_HOST, EC2_USERNAME, EC2_SSH_KEY가 등록되어 있어야 함
#   (이 값들은 git으로 옮겨지지 않으므로, upstream 레포 Settings에 직접 등록 필요)
# - EC2 서버에는 .env 파일이 이미 존재해야 함 (git에 포함되지 않는 민감 정보)
#
# 참고: 추후 운영 서버(EC2 계정/인스턴스)를 새로 옮길 경우,
#       origin을 upstream으로 바로 clone하는 구조로 정리할 예정 (임시 조치)

name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    if: github.repository == 'ManaP0tion/Loop_Backend'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/Loop_Backend/build/libs/"
          strip_components: 2

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Loop_Backend
            mkdir -p build/libs
            git pull upstream dev
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build