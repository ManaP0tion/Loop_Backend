<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">[Loop] 내일 관람 예정 공연 알림</h2>

    <p>
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님,
        내일 관람 예정인 공연이 <strong th:text="${#lists.size(concerts)}">0</strong>건 있어요.
    </p>

    <table style="border-collapse: collapse; width: 100%; max-width: 560px; margin-top: 12px;">
        <thead>
            <tr style="background: #f5f5f5;">
                <th style="text-align: left; padding: 8px; border-bottom: 1px solid #ddd;">공연</th>
                <th style="text-align: left; padding: 8px; border-bottom: 1px solid #ddd;">장소</th>
                <th style="text-align: right; padding: 8px; border-bottom: 1px solid #ddd;">관람일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="concert : ${concerts}">
                <td style="padding: 8px; border-bottom: 1px solid #eee;"
                    th:text="${concert.concertTitle}">공연명</td>
                <td style="padding: 8px; border-bottom: 1px solid #eee;"
                    th:text="${concert.venue != null} ? ${concert.venue} : '-'">장소</td>
                <td style="padding: 8px; border-bottom: 1px solid #eee; text-align: right;"
                    th:text="${#temporals.format(concert.watchDate, 'yyyy-MM-dd')}">-</td>
            </tr>
        </tbody>
    </table>

    <p style="margin-top: 20px;">
        <a th:href="${frontendUrl}" th:text="${frontendUrl}"
           style="display: inline-block; padding: 10px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 4px;">
            Loop 에서 확인하기
        </a>
    </p>

    <p style="color: #888; font-size: 12px; margin-top: 24px;">
        본 메일은 Loop 공연 리마인더 시스템에서 자동 발송되었습니다.
    </p>
</body>
</html>
