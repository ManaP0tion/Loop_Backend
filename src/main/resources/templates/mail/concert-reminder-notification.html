<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님, 내일은 기다리던 공연 날이에요!
    </h2>

    <div th:each="concert : ${concerts}" style="margin-top: 16px; padding: 12px 0; border-bottom: 1px solid #eee;">
        <p style="font-weight: bold; margin: 0 0 4px;" th:text="${concert.concertTitle}">공연명</p>
        <p style="color: #555; margin: 0;">
            <span th:text="${#temporals.format(concert.watchDate, 'yyyy-MM-dd')}">-</span>
            <span th:if="${concert.venue != null}"> · <span th:text="${concert.venue}">장소</span></span>
        </p>
    </div>

    <p style="margin-top: 20px;">
        동행과 만날 준비 되셨나요?<br/>
        채팅으로 만날 시간과 장소를 미리 정해두면 당일이 훨씬 수월해요.
    </p>

    <p>혹시 참석이 어려워지셨다면, 동행에게 미리 알려주세요!</p>

    <p style="margin-top: 20px;">
        <a th:href="${frontendUrl} + '/chat'"
           style="display: inline-block; padding: 10px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 4px;">
            채팅 바로가기
        </a>
    </p>

    <p style="color: #888; font-size: 13px; margin-top: 24px;">
        또한 안전한 동행을 위해, 공개된 장소에서 만나고<br/>
        개인정보·금전 요구에는 주의해 주세요.
    </p>
</body>
</html>
