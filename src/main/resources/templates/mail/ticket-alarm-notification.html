<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;" th:text="${headline}">내일 선예매가 열려요 🎟</h2>

    <p>
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님,
        <span th:text="${intro}">알림을 신청한 공연의 선예매가 내일 시작돼요.</span>
    </p>

    <div style="margin-top: 16px; padding: 12px 16px; border: 1px solid #e5e5e5; border-radius: 6px;">
        <div style="font-size: 12px; color: #888;" th:text="${mail.saleTypeName}">선예매</div>
        <div style="font-size: 16px; font-weight: bold; margin: 2px 0 6px;" th:text="${mail.concertTitle}">공연명</div>
        <div style="font-size: 15px; font-weight: bold; color: #111;" th:text="${mail.opensAt} + ' 오픈'">12월 2일 (화) 오후 8:00 오픈</div>
        <div style="font-size: 14px; color: #444;">
            <span th:text="${mail.period}">2026.12.24</span>
            <span th:if="${mail.venueName != null}" th:text="' · ' + ${mail.venueName}"> · 공연장</span>
        </div>

        <div th:if="${!mail.vendors.isEmpty()}" style="margin-top: 10px;">
            <th:block th:each="vendor : ${mail.vendors}">
                <a th:if="${vendor.url != null}" th:href="${vendor.url}" th:text="${vendor.name}"
                   style="display: inline-block; margin: 0 6px 6px 0; padding: 6px 12px; border: 1px solid #111; color: #111; text-decoration: none; border-radius: 4px; font-size: 14px;">예매처</a>
                <span th:if="${vendor.url == null}" th:text="${vendor.name}"
                      style="display: inline-block; margin: 0 6px 6px 0; padding: 6px 12px; color: #444; font-size: 14px;">예매처</span>
            </th:block>
        </div>

        <a th:href="${frontendUrl} + '/concerts/' + ${mail.concertId}"
           style="display: inline-block; margin-top: 10px; padding: 8px 14px; background: #111; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px;">
            공연 보러가기
        </a>
    </div>

    <p th:if="${unsubscribeUrl != null}" style="margin-top: 32px; font-size: 12px; color: #888;">
        이 공연의 <span th:text="${mail.saleTypeName}">선예매</span> 알림을 그만 받으려면
        <a th:href="${unsubscribeUrl}" style="color: #888;">수신거부</a>를 눌러주세요.
    </p>
</body>
</html>
