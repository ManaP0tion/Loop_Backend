<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">새 공연이 등록됐어요.🎫</h2>

    <p>
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님, Loop에 새로 올라온 공연을 확인해 보세요.
    </p>

    <div th:each="concert : ${concerts}"
         style="margin-top: 16px; padding: 12px 16px; border: 1px solid #e5e5e5; border-radius: 6px;">
        <div style="font-size: 12px; color: #888;" th:text="${concert.categoryName}">단독 공연</div>
        <div style="font-size: 16px; font-weight: bold; margin: 2px 0 6px;" th:text="${concert.title}">공연명</div>
        <div style="font-size: 14px; color: #444;">
            <span th:text="${concert.period}">2026.12.24</span>
            <span th:if="${concert.venueName != null}" th:text="' · ' + ${concert.venueName}"> · 공연장</span>
        </div>
        <a th:href="${frontendUrl} + '/concerts/' + ${concert.concertId}"
           style="display: inline-block; margin-top: 10px; padding: 8px 14px; background: #111; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px;">
            공연 보러가기
        </a>
    </div>

    <p style="margin-top: 32px; font-size: 12px; color: #888;">
        더 이상 새 공연 알림 메일을 받지 않으려면
        <a th:href="${frontendUrl} + '/settings/notifications'" style="color: #888;">알림 설정</a>에서 새 공연 알림을 꺼주세요.
    </p>
</body>
</html>
