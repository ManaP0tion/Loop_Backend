<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">[Loop] 확인하지 않은 채팅이 있어요</h2>

    <p>
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님,
        어제까지 도착한 메시지 중 <strong th:text="${totalUnread}">0</strong>건이 아직 읽지 않은 상태예요.
    </p>

    <table style="border-collapse: collapse; width: 100%; max-width: 560px; margin-top: 12px;">
        <thead>
            <tr style="background: #f5f5f5;">
                <th style="text-align: left; padding: 8px; border-bottom: 1px solid #ddd;">상대방</th>
                <th style="text-align: right; padding: 8px; border-bottom: 1px solid #ddd;">안읽은 메시지</th>
                <th style="text-align: right; padding: 8px; border-bottom: 1px solid #ddd;">마지막 도착</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="room : ${rooms}">
                <td style="padding: 8px; border-bottom: 1px solid #eee;"
                    th:text="${room.partnerNickname != null} ? ${room.partnerNickname} : '알 수 없음'">상대방</td>
                <td style="padding: 8px; border-bottom: 1px solid #eee; text-align: right;"
                    th:text="${room.unreadCount}">0</td>
                <td style="padding: 8px; border-bottom: 1px solid #eee; text-align: right;"
                    th:text="${#temporals.format(room.lastMessageAt, 'yyyy-MM-dd HH:mm')}">-</td>
            </tr>
        </tbody>
    </table>

    <p style="margin-top: 20px;">
        <a th:href="${frontendUrl}" th:text="${frontendUrl}"
           style="display: inline-block; padding: 10px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 4px;">
            Loop 에서 확인하기
        </a>
    </p>

    <p style="color: #888; font-size: 12px; margin-top: 24px;">
        본 메일은 Loop 채팅 알림 시스템에서 자동 발송되었습니다.
    </p>
</body>
</html>
