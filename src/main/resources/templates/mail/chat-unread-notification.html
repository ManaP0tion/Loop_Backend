<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님, 확인하지 못한 메시지가 있어요.📩
    </h2>

    <p>
        동행이 답장을 기다리고 있을 수 있어요.<br/>
        공연 전 소중한 인연을 놓치지 않도록, 잠깐 확인해 보세요.
    </p>

    <p style="margin-top: 20px;">
        <a th:href="${frontendUrl}"
           style="display: inline-block; padding: 10px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 4px;">
            메시지 확인하기
        </a>
    </p>
</body>
</html>
