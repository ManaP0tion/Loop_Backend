<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
    <h2 style="margin-bottom: 8px;">
        <strong th:text="${recipientNickname != null} ? ${recipientNickname} : '회원'">회원</strong>님에게 새로운 메시지가 도착했어요.📩
    </h2>

    <p>
        <strong th:text="${partnerNickname != null} ? ${partnerNickname} : '상대방'">상대방</strong>님
        <span th:if="${concertTitle != null}"> · <span th:text="${concertTitle}">공연명</span></span>
    </p>

    <p>지금 확인하고 동행 이야기를 이어가 보세요.</p>

    <p style="margin-top: 20px;">
        <a th:href="${frontendUrl}"
           style="display: inline-block; padding: 10px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 4px;">
            메시지 확인하기
        </a>
    </p>
</body>
</html>
