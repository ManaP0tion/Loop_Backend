# application.yml
spring:
  application:
    name: Loop_Backend

  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET}
  auth-url: https://kauth.kakao.com
  api-url: https://kapi.kakao.com

frontend:
  url: ${FRONTEND_URL}

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:${FRONTEND_URL}}

kopis:
  api-key: ${KOPIS_API_KEY}

report:
  admin-email: ${REPORT_ADMIN_EMAIL}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    public-bucket: ${AWS_S3_PUBLIC_BUCKET:loop-public-storage}
    private-bucket: ${AWS_S3_PRIVATE_BUCKET:loop-private-storage}

discord:
  webhook:
    report: ${DISCORD_REPORT_WEBHOOK_URL:}
