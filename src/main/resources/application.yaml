# application.yml
spring:
  application:
    name: Loop_Backend

  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.loop: INFO
  pattern:
    console: "%d{HH:mm:ss} [%level] [user:%X{userId}] %logger{36} - %msg%n"

# 발신 전용 SES 계정 — 공연 리마인드/미확인 채팅/이메일 인증코드 발송용 (신고·문의 알림은 위 spring.mail(Gmail) 유지)
ses:
  mail:
    host: ${SES_MAIL_HOST}
    port: ${SES_MAIL_PORT:587}
    username: ${SES_MAIL_USERNAME}
    password: ${SES_MAIL_PASSWORD}
    from: ${SES_MAIL_FROM}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# local 을 제외한 프로필에서 스웨거 문서 접근을 게이트하는 전용 계정 (ADMIN 롤과 무관)
swagger:
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:${KAKAO_REDIRECT_URI}}
  client-secret: ${KAKAO_CLIENT_SECRET}
  auth-url: https://kauth.kakao.com
  api-url: https://kapi.kakao.com

frontend:
  url: ${FRONTEND_URL}

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:${FRONTEND_URL}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

kopis:
  api-key: ${KOPIS_API_KEY}

report:
  admin-email: ${REPORT_ADMIN_EMAIL}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    public-bucket: ${AWS_S3_PUBLIC_BUCKET:loop-public-storage}
    private-bucket: ${AWS_S3_PRIVATE_BUCKET:loop-private-storage}

discord:
  webhook:
    report: ${DISCORD_REPORT_WEBHOOK_URL:}
    inquiry: ${DISCORD_INQUIRY_WEBHOOK_URL:}
