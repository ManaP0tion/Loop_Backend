<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F7F7F8;
            --surface: #FFFFFF;
            --sidebar: #FAFAFA;
            --border: #E5E7EB;
            --accent: #D97706;
            --accent-light: #FEF3C7;
            --accent-hover: #B45309;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --bubble-me: #D97706;
            --bubble-other: #F3F4F6;
            --danger: #EF4444;
            --success: #10B981;
            --info: #3B82F6;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .topbar-logo {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-logo svg { width: 20px; height: 20px; }
        .topbar-divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
        .topbar-field {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .topbar input {
            padding: 5px 9px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-primary);
            background: var(--bg);
            outline: none;
            transition: border-color .15s;
        }
        .topbar input:focus { border-color: var(--accent); }
        #tokenInput { width: 240px; font-family: monospace; }
        #userIdInput { width: 54px; }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--bg); color: var(--text-primary); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #DC2626; }
        .btn-info { background: var(--info); color: white; }
        .btn-info:hover { background: #2563EB; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            background: #F3F4F6;
            color: var(--text-muted);
            transition: all .2s;
            flex-shrink: 0;
        }
        .status-pill.connected { background: #ECFDF5; color: var(--success); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        /* ── Main Layout ── */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 12px 12px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .room-list { flex: 1; overflow-y: auto; padding: 6px; }
        .room-list::-webkit-scrollbar { width: 3px; }
        .room-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .room-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .12s;
        }
        .room-item:hover { background: rgba(0,0,0,.04); }
        .room-item.active { background: var(--accent-light); }
        .room-item.active .room-name { color: var(--accent); }

        .avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
        }
        .avatar-ph {
            width: 42px; height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #D97706 0%, #92400E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: white;
        }

        .room-info { flex: 1; min-width: 0; }
        .room-meta { display: flex; align-items: baseline; gap: 4px; margin-bottom: 2px; }
        .room-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .room-sub { font-size: 11px; color: var(--text-muted); }
        .room-last { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .room-time { font-size: 10px; color: var(--text-muted); }
        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 800;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .sidebar-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .sidebar-footer-row { display: flex; gap: 6px; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
        .empty-state svg { width: 36px; height: 36px; opacity: .3; }

        /* ── Chat Panel ── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--surface);
        }

        .chat-header {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; }
        .chat-header-avatar.ph {
            background: linear-gradient(135deg, #D97706, #92400E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: white;
        }
        .chat-header-info { flex: 1; }
        .chat-header-name { font-size: 14px; font-weight: 700; }
        .chat-header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
        .chat-header-actions { display: flex; gap: 6px; }

        .chat-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 13px;
            background: var(--bg);
        }
        .chat-placeholder svg { width: 52px; height: 52px; opacity: .2; }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--bg);
        }
        .messages-area::-webkit-scrollbar { width: 3px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .msg-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 6px;
        }
        .msg-divider::before, .msg-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .msg-divider span { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

        .msg-row { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 2px; }
        .msg-row.me { flex-direction: row-reverse; }

        .msg-avatar {
            width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #6B7280, #374151);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; color: white;
        }

        .msg-wrap { display: flex; flex-direction: column; gap: 2px; max-width: 62%; }
        .msg-row.me .msg-wrap { align-items: flex-end; }

        .msg-sender { font-size: 10px; font-weight: 600; color: var(--text-muted); padding: 0 4px; }
        .msg-bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-row.me .msg-bubble {
            background: var(--bubble-me);
            color: white;
            border-bottom-right-radius: 3px;
        }
        .msg-row.other .msg-bubble {
            background: var(--bubble-other);
            color: var(--text-primary);
            border-bottom-left-radius: 3px;
        }
        .msg-time { font-size: 10px; color: var(--text-muted); padding: 0 4px; }

        .input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--surface);
            flex-shrink: 0;
        }
        .input-wrap {
            flex: 1;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            background: var(--bg);
            transition: border-color .15s;
        }
        .input-wrap:focus-within { border-color: var(--accent); }
        .input-wrap input {
            border: none; background: transparent; outline: none;
            font-size: 13px; color: var(--text-primary); width: 100%;
        }
        .send-btn {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: var(--accent); color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background .15s;
        }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { background: var(--border); cursor: not-allowed; }
        .send-btn svg { width: 16px; height: 16px; }

        /* ── Toast ── */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 6px; z-index: 1000;
        }
        .toast {
            padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
            color: white; background: var(--text-primary); box-shadow: var(--shadow-md);
            animation: slideIn .18s ease; max-width: 280px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--info); }
        @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .spinner {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.4);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal {
            background: var(--surface); border-radius: var(--radius);
            padding: 24px; width: 360px; box-shadow: var(--shadow-md);
        }
        .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
        .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .modal-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .modal-input {
            padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 13px; outline: none; transition: border-color .15s;
        }
        .modal-input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <div class="topbar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Loop Chat
    </div>
    <div class="topbar-divider"></div>
    <div class="topbar-field">
        <span class="topbar-label">ID</span>
        <input id="userIdInput" type="number" value="" min="1" placeholder="유저 ID" />
    </div>
    <div class="topbar-field">
        <span class="topbar-label">JWT</span>
        <input id="tokenInput" type="text" placeholder="accessToken" />
    </div>
    <button class="btn btn-success" onclick="createTestUser()">+ 테스트 유저 생성</button>
    <div class="topbar-divider"></div>
    <div class="status-pill" id="statusPill">
        <div class="status-dot"></div>
        <span id="statusText">미연결</span>
    </div>
    <button class="btn btn-primary" id="connectBtn" onclick="connectWs()">WS 연결</button>
    <button class="btn btn-danger" id="disconnectBtn" onclick="disconnectWs()" style="display:none;">연결 해제</button>
</div>

<!-- Main -->
<div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">채팅방 목록</span>
            <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;" onclick="loadRooms()" id="refreshBtn">새로고침</button>
        </div>
        <div class="room-list" id="roomList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>테스트 유저를 생성하거나<br>채팅방 목록을 불러오세요</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-footer-row">
                <button class="btn btn-info" style="flex:1;" onclick="showCreateRoomModal()">1:1 채팅 시작</button>
                <button class="btn btn-ghost" style="flex:1;" onclick="loadRooms()">목록 불러오기</button>
            </div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel">
        <div id="chatHeader" class="chat-header" style="display:none;">
            <div id="headerAvatar" class="chat-header-avatar ph">?</div>
            <div class="chat-header-info">
                <div class="chat-header-name" id="headerName">—</div>
                <div class="chat-header-sub" id="headerSub">—</div>
            </div>
            <div class="chat-header-actions">
                <button class="btn btn-ghost" style="font-size:11px;" onclick="markAsRead()">읽음 처리</button>
                <button class="btn btn-ghost" style="font-size:11px;" onclick="sendEnter()">입장</button>
                <button class="btn btn-ghost" style="font-size:11px;" onclick="sendLeave()">퇴장</button>
            </div>
        </div>

        <div id="chatPlaceholder" class="chat-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>채팅방을 선택하세요</span>
        </div>

        <div class="messages-area" id="messagesArea" style="display:none;flex-direction:column;"></div>

        <div class="input-area" id="inputArea" style="display:none;">
            <div class="input-wrap">
                <input id="msgInput" type="text" placeholder="메시지를 입력하세요..."
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}" />
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- 1:1 채팅 시작 Modal -->
<div class="modal-overlay" id="createRoomModal" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal">
        <h3>1:1 채팅 시작</h3>
        <div class="modal-field">
            <label class="modal-label">내 유저 ID</label>
            <input class="modal-input" id="modalMyId" type="number" placeholder="내 ID" />
        </div>
        <div class="modal-field">
            <label class="modal-label">상대방 유저 ID</label>
            <input class="modal-input" id="modalTargetId" type="number" placeholder="상대 ID" />
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="document.getElementById('createRoomModal').style.display='none'">취소</button>
            <button class="btn btn-primary" onclick="startDirectChat()">채팅 시작</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    let stompClient = null;
    let currentRoomId = null;
    let currentSub = null;
    let roomMap = {};

    const myId = () => parseInt(document.getElementById('userIdInput').value) || 0;
    const token = () => document.getElementById('tokenInput').value.trim();

    // ── Auth header helper ──
    function authHeaders(extra = {}) {
        const t = token();
        const h = { 'Content-Type': 'application/json', ...extra };
        if (t) h['Authorization'] = 'Bearer ' + t;
        return h;
    }

    // ── Toast ──
    function toast(msg, type = '', duration = 3000) {
        const el = document.createElement('div');
        el.className = 'toast' + (type ? ' ' + type : '');
        el.textContent = msg;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), duration);
    }

    // ── Create Test User ──
    async function createTestUser() {
        try {
            const res = await fetch('/api/test/users', { method: 'POST' });
            const data = await res.json();
            if (!data.success) throw new Error(data.message);
            const { userId, nickname, accessToken } = data.data;
            document.getElementById('userIdInput').value = userId;
            if (accessToken) document.getElementById('tokenInput').value = accessToken;
            toast(`유저 생성 완료: ${nickname} (ID: ${userId})`, 'success');
            document.getElementById('modalMyId').value = userId;
            await loadRooms();
        } catch (e) {
            toast('유저 생성 실패: ' + e.message, 'error');
        }
    }

    // ── Load Rooms ──
    async function loadRooms() {
        const uid = myId();
        if (!uid) { toast('유저 ID를 먼저 입력하세요', 'error'); return; }
        const btn = document.getElementById('refreshBtn');
        btn.innerHTML = '<span class="spinner"></span>';
        btn.disabled = true;
        try {
            const res = await fetch(`/api/chat/rooms/user/${uid}`, { headers: authHeaders() });
            const data = await res.json();
            renderRoomList(data.data || []);
        } catch (e) {
            toast('채팅방 불러오기 실패: ' + e.message, 'error');
        } finally {
            btn.innerHTML = '새로고침';
            btn.disabled = false;
        }
    }

    function renderRoomList(rooms) {
        const list = document.getElementById('roomList');
        if (!rooms.length) {
            list.innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>참여 중인 채팅방이 없습니다</span>
            </div>`;
            return;
        }
        roomMap = {};
        list.innerHTML = '';
        rooms.forEach(room => {
            roomMap[room.id] = room;
            list.appendChild(buildRoomItem(room));
        });
    }

    function buildRoomItem(room) {
        const div = document.createElement('div');
        div.className = 'room-item' + (room.id === currentRoomId ? ' active' : '');
        div.dataset.roomId = room.id;
        div.onclick = () => selectRoom(room.id);

        const name = room.otherUserNickname || room.name || ('채팅방 #' + room.id);
        const initial = name.charAt(0).toUpperCase();
        const genderAge = fmtGenderAge(room.otherUserGender, room.otherUserBirthDate);
        const lastMsg = room.lastMessageContent || '아직 메시지가 없습니다';
        const lastAt = room.lastMessageAt ? fmtTime(room.lastMessageAt) : '';

        const avatarHtml = room.otherUserProfileImageUrl
            ? `<img class="avatar" src="${esc(room.otherUserProfileImageUrl)}" onerror="this.outerHTML='<div class=\\'avatar-ph\\'>${initial}</div>'">`
            : `<div class="avatar-ph">${initial}</div>`;

        const badge = room.unreadCount > 0
            ? `<div class="unread-badge">${room.unreadCount > 99 ? '99+' : room.unreadCount}</div>` : '';

        div.innerHTML = `${avatarHtml}
            <div class="room-info">
                <div class="room-meta">
                    <span class="room-name">${esc(name)}</span>
                    ${genderAge ? `<span class="room-sub">${genderAge}</span>` : ''}
                </div>
                <div class="room-last">${esc(lastMsg)}</div>
            </div>
            <div class="room-right">
                <span class="room-time">${lastAt}</span>
                ${badge}
            </div>`;
        return div;
    }

    // ── Select Room ──
    async function selectRoom(roomId) {
        currentRoomId = roomId;
        document.querySelectorAll('.room-item').forEach(el =>
            el.classList.toggle('active', parseInt(el.dataset.roomId) === roomId));

        const room = roomMap[roomId];
        showChatPanel(room);
        await loadMessages(roomId);

        if (stompClient?.connected) subscribeRoom(roomId);
        if (room?.unreadCount > 0) await markAsRead(true);
    }

    function showChatPanel(room) {
        document.getElementById('chatPlaceholder').style.display = 'none';
        document.getElementById('chatHeader').style.display = 'flex';
        document.getElementById('messagesArea').style.display = 'flex';
        document.getElementById('inputArea').style.display = 'flex';

        const name = room?.otherUserNickname || room?.name || ('채팅방 #' + currentRoomId);
        document.getElementById('headerName').textContent = name;
        document.getElementById('headerSub').textContent =
            [room?.otherUserGender === 'MALE' ? '남' : room?.otherUserGender === 'FEMALE' ? '여' : null,
             room?.otherUserBirthDate ? calcAge(room.otherUserBirthDate) + '세' : null,
             `채팅방 #${currentRoomId}`].filter(Boolean).join(' · ');

        const av = document.getElementById('headerAvatar');
        if (room?.otherUserProfileImageUrl) {
            av.outerHTML = `<img id="headerAvatar" class="chat-header-avatar" src="${esc(room.otherUserProfileImageUrl)}" onerror="this.className='chat-header-avatar ph';this.textContent='${name.charAt(0).toUpperCase()}'">`;
        } else {
            av.className = 'chat-header-avatar ph';
            av.textContent = name.charAt(0).toUpperCase();
        }
    }

    // ── Load Messages ──
    async function loadMessages(roomId) {
        const area = document.getElementById('messagesArea');
        area.innerHTML = '';
        try {
            const res = await fetch(`/api/chat/rooms/${roomId}/messages`, { headers: authHeaders() });
            const data = await res.json();
            const msgs = data.data || [];
            if (msgs.length > 0) {
                addDivider('이전 메시지');
                msgs.forEach(m => appendMessage(m));
                addDivider('여기부터 실시간');
            } else {
                addDivider('아직 메시지가 없습니다');
            }
        } catch (e) {
            toast('메시지 로드 실패: ' + e.message, 'error');
        }
    }

    // ── WebSocket ──
    function connectWs() {
        const socket = new SockJS('/ws/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        const t = token();
        const headers = t ? { Authorization: 'Bearer ' + t } : {};
        stompClient.connect(headers, () => {
            setConnected(true);
            toast('WebSocket 연결됨', 'success');
            if (currentRoomId) subscribeRoom(currentRoomId);
        }, err => {
            setConnected(false);
            toast('연결 실패: ' + String(err).substring(0, 80), 'error');
        });
    }

    function disconnectWs() {
        stompClient?.disconnect();
        setConnected(false);
        toast('연결 해제됨');
    }

    function subscribeRoom(roomId) {
        currentSub?.unsubscribe();
        currentSub = stompClient.subscribe('/sub/chat/room/' + roomId, frame => {
            appendMessage(JSON.parse(frame.body));
        });
    }

    function setConnected(on) {
        document.getElementById('statusPill').className = 'status-pill' + (on ? ' connected' : '');
        document.getElementById('statusText').textContent = on ? '연결됨' : '미연결';
        document.getElementById('connectBtn').style.display = on ? 'none' : '';
        document.getElementById('disconnectBtn').style.display = on ? '' : 'none';
    }

    // ── Send ──
    function sendMessage() {
        if (!stompClient?.connected) { toast('먼저 WS 연결하세요', 'error'); return; }
        if (!currentRoomId) { toast('채팅방을 선택하세요', 'error'); return; }
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content) return;
        stompClient.send('/pub/chat/message', {}, JSON.stringify({
            type: 'TALK', roomId: currentRoomId, senderId: myId(), content
        }));
        input.value = '';
    }

    function sendEnter() { sendSystem('ENTER'); }
    function sendLeave() { sendSystem('LEAVE'); }
    function sendSystem(type) {
        if (!stompClient?.connected) { toast('먼저 WS 연결하세요', 'error'); return; }
        if (!currentRoomId) { toast('채팅방을 선택하세요', 'error'); return; }
        stompClient.send('/pub/chat/message', {}, JSON.stringify({
            type, roomId: currentRoomId, senderId: myId(), content: type
        }));
    }

    // ── Mark as Read ──
    async function markAsRead(silent = false) {
        if (!currentRoomId) return;
        try {
            const res = await fetch(`/api/chat/rooms/${currentRoomId}/read?userId=${myId()}`, {
                method: 'PATCH', headers: authHeaders()
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.message);
            const item = document.querySelector(`.room-item[data-room-id="${currentRoomId}"]`);
            item?.querySelector('.unread-badge')?.remove();
            if (roomMap[currentRoomId]) roomMap[currentRoomId].unreadCount = 0;
            if (!silent) toast('읽음 처리 완료', 'success');
        } catch (e) {
            if (!silent) toast('읽음 처리 실패: ' + e.message, 'error');
        }
    }

    // ── Start Direct Chat ──
    function showCreateRoomModal() {
        document.getElementById('modalMyId').value = myId() || '';
        document.getElementById('createRoomModal').style.display = 'flex';
    }

    async function startDirectChat() {
        const myUserId = parseInt(document.getElementById('modalMyId').value);
        const targetUserId = parseInt(document.getElementById('modalTargetId').value);
        if (!myUserId || !targetUserId) { toast('ID를 모두 입력하세요', 'error'); return; }
        try {
            const res = await fetch('/api/chat/direct', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ myUserId, targetUserId })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.message);
            document.getElementById('createRoomModal').style.display = 'none';
            toast('채팅방 생성 완료 (ID: ' + data.data.id + ')', 'success');
            await loadRooms();
            await selectRoom(data.data.id);
        } catch (e) {
            toast('채팅방 생성 실패: ' + e.message, 'error');
        }
    }

    // ── Render helpers ──
    function appendMessage(msg) {
        const area = document.getElementById('messagesArea');
        const isMe = msg.senderId === myId();
        const isSystem = msg.type === 'ENTER' || msg.type === 'LEAVE';

        if (isSystem) {
            const label = { ENTER: '입장', LEAVE: '퇴장' }[msg.type] || msg.type;
            addDivider(`유저${msg.senderId} ${label}`);
            return;
        }

        const row = document.createElement('div');
        row.className = 'msg-row ' + (isMe ? 'me' : 'other');
        const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
        const initial = String(msg.senderId || '?').charAt(0);
        const avatarHtml = isMe ? '' : `<div class="msg-avatar">${initial}</div>`;
        const senderHtml = isMe ? '' : `<div class="msg-sender">유저${msg.senderId}</div>`;

        row.innerHTML = `${avatarHtml}
            <div class="msg-wrap">
                ${senderHtml}
                <div class="msg-bubble">${esc(msg.content)}</div>
                ${time ? `<div class="msg-time">${time}</div>` : ''}
            </div>`;
        area.appendChild(row);
        area.scrollTop = area.scrollHeight;
    }

    function addDivider(text) {
        const el = document.createElement('div');
        el.className = 'msg-divider';
        el.innerHTML = `<span>${esc(text)}</span>`;
        document.getElementById('messagesArea').appendChild(el);
    }

    // ── Utils ──
    function esc(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtGenderAge(gender, birthDate) {
        const g = gender === 'MALE' ? '남' : gender === 'FEMALE' ? '여' : '';
        const age = birthDate ? calcAge(birthDate) + '세' : '';
        return [g, age].filter(Boolean).join(' · ');
    }
    function calcAge(dateStr) {
        const b = new Date(dateStr), now = new Date();
        let age = now.getFullYear() - b.getFullYear();
        if (now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) age--;
        return age;
    }
    function fmtTime(iso) {
        const d = new Date(iso), now = new Date(), diff = now - d;
        if (diff < 60000) return '방금';
        if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
        if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    }
</script>
</body>
