<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Chat WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #333; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        label { min-width: 80px; font-weight: bold; }
        input[type=number], input[type=text] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; background: #4CAF50; color: white; }
        button.red { background: #f44336; }
        #status { font-weight: bold; color: #888; }
        #status.connected { color: #4CAF50; }
        #messages {
            border: 1px solid #ddd; border-radius: 4px;
            height: 320px; overflow-y: scroll;
            padding: 12px; background: #fafafa;
            margin: 16px 0;
        }
        .msg { margin: 6px 0; }
        .msg .type { font-size: 12px; color: #888; }
        .msg .sender { font-weight: bold; color: #1976D2; }
        .msg .content { color: #333; }
        .msg .time { font-size: 11px; color: #aaa; }
        #content { width: 260px; }
    </style>
</head>
<body>
    <h2>🔌 WebSocket (STOMP) 테스트</h2>

    <div class="row">
        <label>내 유저 ID</label>
        <input id="senderId" type="number" value="1" style="width:80px;" placeholder="유저ID" />
    </div>
    <div class="row">
        <label>Room ID</label>
        <input id="roomId" type="number" value="1" style="width:80px;" />
        <button onclick="connect()">연결</button>
        <button class="red" onclick="disconnect()">해제</button>
        <span id="status">● 미연결</span>
    </div>

    <div id="messages"></div>

    <div class="row">
        <label>메시지</label>
        <input id="content" type="text" placeholder="내용 입력 후 Enter" onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">전송</button>
    </div>
    <div class="row">
        <label></label>
        <button onclick="sendEnter()">입장 알림</button>
        <button onclick="sendLeave()">퇴장 알림</button>
    </div>

    <script>
        let stompClient = null;

        function loadPreviousMessages(roomId) {
            fetch('/api/chat/rooms/' + roomId + '/messages')
                .then(res => res.json())
                .then(data => {
                    if (data.data && data.data.length > 0) {
                        log('시스템', '--- 이전 메시지 ---');
                        data.data.forEach(msg => appendMessage(msg));
                        log('시스템', '--- 여기부터 실시간 ---');
                    }
                })
                .catch(err => log('에러', '이전 메시지 로드 실패: ' + err));
        }

        function connect() {
            const roomId = document.getElementById('roomId').value;
            const socket = new SockJS('/ws/chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // 콘솔 STOMP 로그 끄기

            stompClient.connect({}, function () {
                setStatus(true);
                loadPreviousMessages(roomId);
                stompClient.subscribe('/sub/chat/room/' + roomId, function (frame) {
                    const msg = JSON.parse(frame.body);
                    appendMessage(msg);
                });
                log('시스템', '구독 시작: /sub/chat/room/' + roomId);
            }, function (err) {
                setStatus(false);
                log('에러', err);
            });
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
                setStatus(false);
            }
        }

        function sendMessage() {
            send('TALK');
        }

        function sendEnter() {
            send('ENTER');
        }

        function sendLeave() {
            send('LEAVE');
        }

        function send(type) {
            if (!stompClient || !stompClient.connected) {
                alert('먼저 연결하세요.');
                return;
            }
            const roomId = parseInt(document.getElementById('roomId').value);
            const senderId = parseInt(document.getElementById('senderId').value);
            const content = document.getElementById('content').value || type;

            stompClient.send('/pub/chat/message', {}, JSON.stringify({
                type: type,
                roomId: roomId,
                senderId: senderId,
                content: content
            }));
            document.getElementById('content').value = '';
        }

        function appendMessage(msg) {
            const div = document.getElementById('messages');
            const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString() : '';
            div.innerHTML += `
                <div class="msg">
                    <span class="type">[${msg.type}]</span>
                    <span class="sender">유저${msg.senderId}</span>:
                    <span class="content">${msg.content}</span>
                    <span class="time">${time}</span>
                </div>`;
            div.scrollTop = div.scrollHeight;
        }

        function log(tag, text) {
            const div = document.getElementById('messages');
            div.innerHTML += `<div class="msg"><span class="type">[${tag}]</span> <span class="content">${text}</span></div>`;
            div.scrollTop = div.scrollHeight;
        }

        function setStatus(connected) {
            const el = document.getElementById('status');
            el.textContent = connected ? '● 연결됨' : '● 미연결';
            el.className = connected ? 'connected' : '';
        }
    </script>
</body>
</html>
